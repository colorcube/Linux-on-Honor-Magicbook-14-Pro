# The native hook reports an error when both override directories are empty.
if [[ " ${HOOKS[*]} " != *" acpi_override "* ]] &&
    { compgen -G '/usr/lib/initcpio/acpi_override/*.aml' >/dev/null ||
      compgen -G '/etc/initcpio/acpi_override/*.aml' >/dev/null; }; then
    HOOKS+=(acpi_override)
fi
