# HONOR MagicBook Pro 14 (FMB-P): early-cpio ACPI DSDT override.
# Install as /etc/dracut.conf.d/10-honor-fmbp-dsdt.conf; dracut packs every *.aml in
# acpi_table_dir into the uncompressed early cpio (kernel/firmware/acpi/).
# https://github.com/colorcube/Linux-on-Honor-Magicbook-14-Pro/tree/main/dsdt
acpi_override="yes"
acpi_table_dir="/usr/lib/honor-fmbp/acpi"
