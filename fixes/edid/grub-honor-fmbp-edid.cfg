# Keep administrator-supplied EDID overrides, including mappings for other ports.
case " ${GRUB_CMDLINE_LINUX-} ${GRUB_CMDLINE_LINUX_DEFAULT-} " in
    *' drm.edid_firmware='*|*' drm_kms_helper.edid_firmware='*) ;;
    *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }drm.edid_firmware=eDP-1:edid/honor-fmbp/edp-hdr.bin" ;;
esac
